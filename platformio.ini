; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy_I2C_Scanner]
platform = teensy
board = teensy40
framework = arduino
build_src_filter = 
	-<*>
	+<i2cScanner.cpp>

[env:teensy_LED_test]
platform = teensy
board = teensy40
framework = arduino
build_src_filter = 
	-<*>
	+<main.cpp>
	+<LED.h>
	+<LED.cpp>

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
build_src_filter = 
	+<*>
	-<LibTest.cpp>
	-<i2cScanner.cpp>

[env:lib_test_teensy]
platform = teensy
board = teensy40
framework = arduino
build_src_filter = 
	+<*>
	-<main.cpp>
	-<i2cScanner.cpp>
	-<StabAlg.cpp>
	

[env:nano]
platform = atmelavr
board = nanoatmega328new
framework = arduino
build_src_filter = 
	-<*>
	+<LED.h>
	+<LED.cpp>
	+<main.cpp>

[env:lib_test_nano]
platform = atmelavr
board = nanoatmega328new
framework = arduino
build_src_filter = 
	-<*>
	+<LibTest.cpp>

[env:nano_test_LED]
platform = atmelavr
board = nanoatmega328new
framework = arduino
build_src_filter = 
	-<*>
	+<main.cpp>
	+<LED.h>
	+<LED.cpp>

[env:esp]
platform = espressif32
board = fm-devkit
framework = arduino
