; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:teensy_main]
platform = teensy
board = teensy40
framework = arduino
build_src_filter = 
	-<*>
	+<Clock.cpp>
	+<Data.cpp>
	+<LED.cpp>
	+<StabAlg.cpp>
	+<store3Ddouble.cpp>
	+<store3Dlong.cpp>
	+<main.cpp>

[env:i2c_scanner]
platform = teensy
board = teensy40
framework = arduino
build_src_filter = 
	-<*>
	+<i2cscanner.cpp>

[env:LED]
platform = teensy
board = teensy40
framework = arduino
build_src_filter = 
	-<*>
	+<LEDtest.cpp>

[env:libtest]
platform = teensy
board = teensy40
framework = arduino
build_src_filter = 
	-<*>
	+<LibTest.cpp>

[env:GPStest]
platform = teensy
board = teensy40
framework = arduino
build_src_filter = 
	-<*>
	+<findM9N.cpp>

[env:StabAlgTest]
platform = teensy
board = teensy40
framework = arduino
